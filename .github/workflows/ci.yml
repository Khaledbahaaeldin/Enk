name: CI

on:
  push:
    branches: [ main, "batch-**" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build, Test and Verify Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make scripts executable
        run: chmod +x gradlew scripts/check-no-network.sh scripts/check-fdroid-rules.sh

      - name: Build and Test
        run: ./gradlew build test :app:assembleRelease

      - name: Process Debug Manifest
        run: ./gradlew :app:processDebugManifest

      - name: Check No Network Permissions
        run: ./scripts/check-no-network.sh

      - name: Check F-Droid Compliance Rules
        run: ./scripts/check-fdroid-rules.sh
